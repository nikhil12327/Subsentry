services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: subsentry
      POSTGRES_PASSWORD: subsentry
      POSTGRES_DB: subsentry
    ports:
      - "5432:5432"
    volumes:
      - subsentry_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subsentry -d subsentry"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
volumes:
  subsentry_pg:
